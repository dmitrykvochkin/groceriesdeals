[project]
name = "groceriesdeals"
version = "0.1.0"
description = "Launch Genymotion SaaS cloud devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==3.4.4",
    "posthog>=7.29,<8",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
genymotion = [
    "gmsaas>=1.14.1",
]
scraping = [
    "uiautomator2>=3.0.0",
]

[project.scripts]
genymotion-cloud = "groceriesdeals.genymotion:main"
groceries-mcp = "groceriesdeals.mcp_server:main"
groceries-mcp-http = "groceriesdeals.mcp_server:main_http"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
